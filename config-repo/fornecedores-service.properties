# Configuracoes do fornecedores-service, centralizadas no Config Server.
# Este arquivo e' lido pelo config-server a partir do repositorio Git
# e servido ao fornecedores-service quando ele sobe (spring.config.import=configserver:...).

# 8086: a 8084 ja e do auth-service e a 8085 do gateway
server.port=8086

# H2 em memoria
spring.datasource.url=jdbc:h2:mem:fornecedoresdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2, acessivel em http://localhost:8086/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Registro no Eureka
# defaultZone NAO e definido aqui de proposito: o padrao do Eureka ja e
# http://localhost:8761/eureka/ (rodando local), e no Docker quem define e o
# <servico>-docker.properties / a env var. Se ficasse aqui, este valor (localhost)
# venceria a env var do docker-compose, e o servico nunca acharia o Eureka.
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true