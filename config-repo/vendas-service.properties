server.port=8082

# H2 em memoria
spring.datasource.url=jdbc:h2:mem:vendasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# defaultZone NAO e definido aqui de proposito: o padrao do Eureka ja e
# http://localhost:8761/eureka/ (rodando local), e no Docker quem define e o
# <servico>-docker.properties / a env var. Se ficasse aqui, este valor (localhost)
# venceria a env var do docker-compose, e o servico nunca acharia o Eureka.
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
